<html>
<head>
    <title>3 Step Form</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/additional-methods.min.js"></script>
    <link rel="stylesheet" href="css\style.css">
    <script src="js/script.js" defer></script>
</head>
	<body>
		<form id="stepForm">
			<h1>Registration Form</h1>
			<div class="steps">
				<div class="step-dot active">
					<span>1</span>
					<p>Personal</p>
				</div>
				<div class="line"></div>
				<div class="step-dot">
					<span>2</span>
					<p>Address</p>
				</div>
				<div class="line"></div>
				<div class="step-dot">
					<span>3</span>
					<p>Date</p>
				</div>
			</div>
			<div class="step active">
				<h2>Personal Details</h2>
				<label for="name">
					Name
				</label>
				<input
					type="text"
					id="name"
					name="name"
					placeholder="Enter Name"
					pattern="[A-Za-z ]+"
					required
				>
				<label for="email">
					Email
				</label>
				<input
					type="email"
					id="email"
					name="email"
					placeholder="Enter Email"
					required					
				>
				<label for="mobile">
					Mobile No.
				</label>
				<input
					type="tel"
					id="mobile"
					name="mobile"
					placeholder="Enter Mobile No."
					required	
				>
				<button type="button" class="next">
					Next →
				</button>
			</div>
			<div class="step">
				<h2>Address Details</h2>
				<label for="address">
					Address
				</label>
				<input
					type="text"
					id="address"
					name="address"
					placeholder="Enter Address"
					required					
				>
				<label for="city">
					City
				</label>
				<input
					type="text"
					id="city"
					name="city"
					placeholder="Enter City"
					required					
				>
				<label for="pincode">
					Pin Code
				</label>
				<input
					type="text"
					id="pincode"
					name="pincode"
					placeholder="Enter Pin Code"
					required
				>
				<div class="buttons">
					<button type="button" class="back">
						← Back
					</button>
					<button type="button" class="next">
						Next →
					</button>
				</div>
			</div>
			<div class="step">
				<h2>Date Details</h2>
				<label for="dob">
					Date of Birth
				</label>
				<input 
					type="date" 
					id="dob" 
					name="dob"
					required
				>
				<div class="buttons">
					<button type="button" class="back">
						← Back
					</button>
					<button type="button" class="next">
						Next →
					</button>
				</div>
			</div>
			<div class="success-page">
				<div class="success-icon">✓</div>
				<h2>Form Submitted!</h2>
				<p>
					Your data has been submitted successfully.
				</p>
			</div>
		</form>
	</body>
</html>
